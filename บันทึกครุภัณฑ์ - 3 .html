<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Talent Asset Management</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const { useState, useEffect, useMemo, createElement: h, useRef } = React;

        // --- COMPONENTS ---
        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            return h('span', {
                ...props,
                className: `inline-flex items-center justify-center ${className}`,
                dangerouslySetInnerHTML: { __html: `<i data-lucide="${name}" style="width:100%; height:100%"></i>` }
            });
        };

        const refreshIcons = () => {
            if (window.lucide) window.lucide.createIcons();
        };

        // GAS CODE TEMPLATE (Updated: Removed Stock logic)
        const GAS_CODE_TEMPLATE = `function doPost(e) {
  var prop = ContentService.MimeType.JSON;
  try {
    var contents = JSON.parse(e.postData.contents);
    var action = contents.action;
    var data = contents.data;
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sheet = ss.getSheetByName('Sheet1');
    if (!sheet) return ContentService.createTextOutput(JSON.stringify({status: 'error', message: 'Sheet1 not found'})).setMimeType(prop);
    
    // --- Image Backup to Google Drive Logic ---
    if (data.image && data.image.indexOf('data:image') > -1) {
      try {
        var folderName = "MathTalent_Asset_Images";
        var folders = DriveApp.getFoldersByName(folderName);
        var folder = folders.hasNext() ? folders.next() : DriveApp.createFolder(folderName);
        var contentType = data.image.substring(5, data.image.indexOf(';'));
        var bytes = Utilities.base64Decode(data.image.split(',')[1]);
        var blob = Utilities.newBlob(bytes, contentType, (data.code || "IMG") + "_" + new Date().getTime() + ".jpg");
        var file = folder.createFile(blob);
        file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
        data.image = file.getUrl();
      } catch (fErr) {
        data.image = "Error Saving to Drive: " + fErr.toString();
      }
    }

    var headers = sheet.getRange(1, 1, 1, sheet.getLastColumn()).getValues()[0];
    
    if (action === 'create') {
      var newRow = headers.map(function(h) {
        if (h === 'id') return Utilities.getUuid();
        return data[h] || "";
      });
      sheet.appendRow(newRow);
    } else if (action === 'update') {
      var ids = sheet.getRange(2, 1, sheet.getLastRow() - 1, 1).getValues().flat();
      var rowIndex = ids.indexOf(data.id) + 2;
      if (rowIndex > 1) {
        var oldData = sheet.getRange(rowIndex, 1, 1, headers.length).getValues()[0];
        var rowData = headers.map(function(h, i) { 
           if (h === 'image' && (!data[h] || data[h] === "")) return oldData[i];
           return data[h] || ""; 
        });
        sheet.getRange(rowIndex, 1, 1, headers.length).setValues([rowData]);
      }
    }
    return ContentService.createTextOutput(JSON.stringify({status: 'success'})).setMimeType(prop);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status: 'error', message: err.toString()})).setMimeType(prop);
  }
}

function doGet(e) {
  var action = e.parameter.action;
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName('Sheet1');
  var prop = ContentService.MimeType.JSON;
  if (action === 'read') {
    var data = sheet.getDataRange().getValues();
    if (data.length < 1) return ContentService.createTextOutput(JSON.stringify([])).setMimeType(prop);
    var headers = data[0];
    var rows = data.slice(1);
    var result = rows.map(function(row) {
      var obj = {};
      headers.forEach(function(h, i) { obj[h] = row[i]; });
      return obj;
    });
    return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(prop);
  }
}`;

        const CATEGORIES = {
            'สื่อคณิตศาสตร์': 'M',
            'สื่อวิทยาศาสตร์': 'S',
            'อุปกรณ์คอมพิวเตอร์-ไอที': 'C',
            'เบ็ดเตล็ด': 'A'
        };

        // --- MAIN APP ---
        function App() {
            // States
            const [scriptUrl, setScriptUrl] = useState(localStorage.getItem('mt_script_url') || '');
            const [assets, setAssets] = useState([]);
            const [loading, setLoading] = useState(false);
            const [searchTerm, setSearchTerm] = useState('');
            
            // Drawer States
            const [isFormOpen, setIsFormOpen] = useState(false);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            
            // Hardware States
            const [isScanning, setIsScanning] = useState(false);
            const [isCapturing, setIsCapturing] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle');
            const [copied, setCopied] = useState(false);
            
            const videoRef = useRef(null);
            const scannerRef = useRef(null);
            
            const [formData, setFormData] = useState({
                id: '', code: '', name: '', category: 'สื่อคณิตศาสตร์', 
                price: '', location: '', date: new Date().toISOString().split('T')[0], 
                status: 'ใช้งานปกติ', image: ''
            });

            // Effect to refresh icons
            useEffect(() => { refreshIcons(); }, [assets, loading, isScanning, isCapturing, isFormOpen, isSettingsOpen, syncStatus]);

            // Initial Fetch
            useEffect(() => { if (scriptUrl) fetchData(); }, []);

            const fetchData = async () => {
                if (!scriptUrl) return;
                setLoading(true);
                setSyncStatus('syncing');
                try {
                    const response = await fetch(`${scriptUrl}?action=read`);
                    const data = await response.json();
                    setAssets(Array.isArray(data) ? data : []);
                    setSyncStatus('success');
                    setTimeout(() => setSyncStatus('idle'), 3000);
                } catch (e) { 
                    setSyncStatus('error');
                } finally { setLoading(false); }
            };

            const stats = useMemo(() => ({
                totalItems: assets.length,
                totalValue: assets.reduce((sum, item) => sum + Number(item.price || 0), 0)
            }), [assets]);

            const compressImage = (img) => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 400;
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.7);
            };

            // Hardware Functions (Camera/Scanner) - same as before
            const startCamera = async () => {
                setIsCapturing(true);
                setTimeout(async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                        if (videoRef.current) videoRef.current.srcObject = stream;
                    } catch (err) { setIsCapturing(false); alert('Camera Error'); }
                }, 300);
            };
            const stopCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                setIsCapturing(false);
            };
            const takePhoto = () => {
                if (!videoRef.current) return;
                const canvas = document.createElement('canvas');
                canvas.width = videoRef.current.videoWidth;
                canvas.height = videoRef.current.videoHeight;
                canvas.getContext('2d').drawImage(videoRef.current, 0, 0);
                const img = new Image();
                img.onload = () => { setFormData(prev => ({ ...prev, image: compressImage(img) })); stopCamera(); };
                img.src = canvas.toDataURL('image/jpeg');
            };

            // Form Handlers
            const openForm = (item = null) => {
                if (item) {
                    setFormData(item);
                } else {
                    setFormData({ id: '', code: '', name: '', category: 'สื่อคณิตศาสตร์', price: '', location: '', date: new Date().toISOString().split('T')[0], status: 'ใช้งานปกติ', image: '' });
                }
                setIsFormOpen(true);
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!scriptUrl) { setIsSettingsOpen(true); return; }
                setLoading(true);
                setSyncStatus('syncing');
                const action = formData.id ? 'update' : 'create';
                try {
                    await fetch(scriptUrl, {
                        method: 'POST', mode: 'no-cors',
                        cache: 'no-cache', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action, data: formData })
                    });
                    setTimeout(() => {
                        setSyncStatus('success');
                        fetchData();
                        setIsFormOpen(false);
                        setLoading(false);
                    }, 2500);
                } catch (e) { setSyncStatus('error'); setLoading(false); }
            };

            // Auto Code Generator
            useEffect(() => {
                if (!formData.id && !formData.code && isFormOpen) {
                    const prefix = CATEGORIES[formData.category] || 'X';
                    const count = assets.filter(a => a.category === formData.category).length + 1;
                    const newCode = `${prefix}-${String(count).padStart(6, '0')}`;
                    setFormData(prev => ({ ...prev, code: newCode }));
                }
            }, [formData.category, assets.length, formData.id, isFormOpen]);

            const copyToClipboard = () => {
                navigator.clipboard.writeText(GAS_CODE_TEMPLATE);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const filteredAssets = assets.filter(a => 
                (a.name || "").toLowerCase().includes(searchTerm.toLowerCase()) || 
                (a.code || "").toLowerCase().includes(searchTerm.toLowerCase())
            );

            return h('div', { className: "min-h-screen flex flex-col font-sans text-slate-800" },
                
                // --- TOP BAR ---
                h('div', { className: "bg-white shadow-sm z-30 sticky top-0" },
                    h('div', { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" },
                        h('div', { className: "flex justify-between h-16 items-center" },
                            // Logo Area
                            h('div', { className: "flex items-center gap-3" },
                                h('div', { className: "bg-indigo-600 p-2 rounded-lg shadow-indigo-200 shadow-md" },
                                    h(Icon, { name: "box", className: "w-5 h-5 text-white" })
                                ),
                                h('div', null,
                                    h('h1', { className: "font-bold text-lg leading-tight tracking-tight text-slate-800" }, "Math Talent H.Q."),
                                    h('p', { className: "text-[10px] text-slate-400 font-medium tracking-wider uppercase" }, "Asset Management System")
                                )
                            ),
                            // Actions Area
                            h('div', { className: "flex items-center gap-3" },
                                // Sync Indicator
                                h('div', { className: `hidden sm:flex px-3 py-1 rounded-full items-center gap-2 border ${syncStatus === 'success' ? 'bg-green-50 border-green-100 text-green-600' : 'bg-slate-50 border-slate-100 text-slate-500'}` },
                                    h('div', { className: `w-2 h-2 rounded-full ${syncStatus === 'syncing' ? 'bg-amber-400 animate-pulse' : syncStatus === 'success' ? 'bg-green-500' : 'bg-slate-300'}` }),
                                    h('span', { className: "text-xs font-bold" }, syncStatus === 'success' ? 'Cloud Synced' : syncStatus === 'syncing' ? 'Syncing...' : 'Standby')
                                ),
                                h('button', { 
                                    onClick: () => setIsSettingsOpen(true), 
                                    className: "flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg font-semibold text-sm transition-all" 
                                }, h(Icon, { name: "settings", className: "w-4 h-4" }), "ตั้งค่า")
                            )
                        )
                    )
                ),

                // --- MAIN CONTENT ---
                h('div', { className: "flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8" },
                    
                    // Stats Cards
                    h('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6 mb-8" },
                        h('div', { className: "bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-center" },
                            h('p', { className: "text-slate-400 text-xs font-bold uppercase tracking-wider mb-1" }, "ทรัพย์สินรวม"),
                            h('div', { className: "flex items-baseline gap-2" },
                                h('h3', { className: "text-4xl font-black text-slate-800" }, stats.totalItems),
                                h('span', { className: "text-sm text-slate-400 font-medium" }, "รายการ")
                            )
                        ),
                        h('div', { className: "bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-center" },
                            h('p', { className: "text-slate-400 text-xs font-bold uppercase tracking-wider mb-1" }, "มูลค่ารวม"),
                            h('div', { className: "flex items-baseline gap-1" },
                                h('span', { className: "text-xl font-bold text-indigo-600" }, "฿"),
                                h('h3', { className: "text-4xl font-black text-indigo-600" }, stats.totalValue.toLocaleString())
                            )
                        )
                    ),

                    // Toolbar
                    h('div', { className: "flex flex-col sm:flex-row justify-between items-center gap-4 mb-6" },
                        h('div', { className: "relative w-full sm:max-w-md" },
                            h(Icon, { name: "search", className: "absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" }),
                            h('input', { 
                                className: "w-full pl-11 pr-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all shadow-sm", 
                                placeholder: "ค้นหารหัส หรือชื่อทรัพย์สิน...", 
                                value: searchTerm, 
                                onChange: e => setSearchTerm(e.target.value) 
                            })
                        ),
                        h('button', { 
                            onClick: () => openForm(),
                            className: "w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-slate-200 transition-all"
                        }, h(Icon, { name: "plus", className: "w-5 h-5" }), "เพิ่มครุภัณฑ์")
                    ),

                    // Table
                    h('div', { className: "bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden" },
                        h('div', { className: "overflow-x-auto" },
                            h('table', { className: "w-full text-left" },
                                h('thead', { className: "bg-slate-50 border-b border-slate-100" },
                                    h('tr', null,
                                        h('th', { className: "px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider" }, "รหัส/ชื่อ"),
                                        h('th', { className: "px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider" }, "หมวดหมู่"),
                                        h('th', { className: "px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider" }, "สถานะ"),
                                        h('th', { className: "px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-right" }, "ราคา"),
                                        h('th', { className: "px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center" }, "จัดการ")
                                    )
                                ),
                                h('tbody', { className: "divide-y divide-slate-50" },
                                    filteredAssets.length === 0 ? 
                                        h('tr', null, h('td', { colSpan: 5, className: "px-6 py-12 text-center text-slate-400 text-sm" }, "ไม่พบข้อมูลครุภัณฑ์")) :
                                        filteredAssets.map(item => h('tr', { key: item.id || item.code, className: "hover:bg-slate-50/50 transition-colors group" },
                                            h('td', { className: "px-6 py-4" },
                                                h('div', { className: "flex items-center gap-4" },
                                                    h('div', { className: "w-10 h-10 rounded-lg bg-slate-100 border border-slate-200 overflow-hidden flex-shrink-0 flex items-center justify-center" },
                                                        item.image ? h('img', { src: item.image, className: "w-full h-full object-cover" }) : h(Icon, { name: "image", className: "w-4 h-4 text-slate-300" })
                                                    ),
                                                    h('div', null,
                                                        h('p', { className: "text-xs font-bold text-indigo-600 mb-0.5" }, item.code),
                                                        h('p', { className: "text-sm font-bold text-slate-700" }, item.name)
                                                    )
                                                )
                                            ),
                                            h('td', { className: "px-6 py-4" },
                                                h('span', { className: "text-sm text-slate-600" }, item.category)
                                            ),
                                            h('td', { className: "px-6 py-4" },
                                                h('span', { className: "text-xs font-bold px-2 py-1 rounded-full bg-green-50 text-green-700 border border-green-100" }, item.status || 'ปกติ')
                                            ),
                                            h('td', { className: "px-6 py-4 text-right" },
                                                h('span', { className: "text-sm font-bold text-slate-800" }, "฿", Number(item.price || 0).toLocaleString())
                                            ),
                                            h('td', { className: "px-6 py-4 text-center" },
                                                h('button', { 
                                                    onClick: () => openForm(item),
                                                    className: "text-slate-400 hover:text-indigo-600 p-2 rounded-lg hover:bg-indigo-50 transition-all" 
                                                }, h(Icon, { name: "edit-2", className: "w-4 h-4" }))
                                            )
                                        ))
                                )
                            )
                        )
                    )
                ),

                // --- SLIDE-OVER FORM (Right) ---
                h('div', { className: `fixed inset-0 z-50 overflow-hidden ${isFormOpen ? 'pointer-events-auto' : 'pointer-events-none'}` },
                    h('div', { className: `absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-300 ${isFormOpen ? 'opacity-100' : 'opacity-0'}`, onClick: () => setIsFormOpen(false) }),
                    h('div', { className: `absolute inset-y-0 right-0 max-w-full flex transition-transform duration-300 ${isFormOpen ? 'translate-x-0' : 'translate-x-full'}` },
                        h('div', { className: "w-screen max-w-md md:max-w-lg bg-white shadow-2xl flex flex-col h-full" },
                            // Header
                            h('div', { className: "px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white" },
                                h('h2', { className: "text-lg font-black text-slate-800" }, formData.id ? "แก้ไขข้อมูล" : "เพิ่มครุภัณฑ์ใหม่"),
                                h('button', { onClick: () => setIsFormOpen(false), className: "p-2 hover:bg-slate-50 rounded-full transition-colors" }, h(Icon, { name: "x", className: "w-5 h-5 text-slate-400" }))
                            ),
                            // Body
                            h('div', { className: "flex-1 overflow-y-auto p-6 custom-scroll bg-slate-50/50" },
                                h('form', { onSubmit: handleSubmit, className: "space-y-6" },
                                    // Image Section
                                    h('div', { className: "flex flex-col items-center gap-3" },
                                        h('div', { className: "w-full h-48 bg-white border-2 border-dashed border-slate-200 rounded-2xl flex flex-col items-center justify-center overflow-hidden relative group" },
                                            formData.image ? 
                                                h('img', { src: formData.image, className: "w-full h-full object-contain" }) : 
                                                h('div', { className: "text-center" }, 
                                                    h('div', { className: "bg-slate-50 p-3 rounded-full inline-block mb-2" }, h(Icon, { name: "image", className: "w-6 h-6 text-slate-300" })),
                                                    h('p', { className: "text-xs text-slate-400 font-medium" }, "ยังไม่มีรูปภาพ")
                                                )
                                        ),
                                        h('div', { className: "flex gap-2 w-full" },
                                            h('button', { type: "button", onClick: startCamera, className: "flex-1 bg-indigo-600 text-white py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-indigo-700 transition-all" }, h(Icon, { name: "camera", className: "w-4 h-4" }), "ถ่ายรูป"),
                                            h('button', { type: "button", onClick: () => document.getElementById('fileIn').click(), className: "flex-1 bg-white border border-slate-200 text-slate-600 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-slate-50 transition-all" }, h(Icon, { name: "upload", className: "w-4 h-4" }), "เลือกไฟล์"),
                                            h('input', { id: "fileIn", type: "file", className: "hidden", onChange: (e) => {
                                                const r = new FileReader(); r.onload = (ev) => { const i = new Image(); i.onload = () => setFormData({...formData, image: compressImage(i)}); i.src = ev.target.result; }; r.readAsDataURL(e.target.files[0]);
                                            }})
                                        )
                                    ),
                                    
                                    // Inputs
                                    h('div', { className: "space-y-4" },
                                        h('div', null,
                                            h('label', { className: "text-xs font-bold text-slate-500 uppercase mb-1.5 block" }, "หมวดหมู่"),
                                            h('select', { 
                                                className: "w-full p-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all",
                                                value: formData.category,
                                                onChange: e => setFormData({...formData, category: e.target.value, id: '', code: ''}) 
                                            }, Object.keys(CATEGORIES).map(c => h('option', { key: c, value: c }, c)))
                                        ),
                                        h('div', null,
                                            h('label', { className: "text-xs font-bold text-slate-500 uppercase mb-1.5 block" }, "รหัสทรัพย์สิน"),
                                            h('div', { className: "flex gap-2" },
                                                h('input', { 
                                                    className: "flex-1 p-3 bg-white border border-slate-200 rounded-xl text-sm font-mono font-bold text-indigo-600 outline-none focus:ring-2 focus:ring-indigo-500", 
                                                    value: formData.code, 
                                                    onChange: e => setFormData({...formData, code: e.target.value}) 
                                                }),
                                                h('button', { type: "button", onClick: () => { setIsScanning(true); setTimeout(() => {
                                                    const qr = new Html5Qrcode("reader");
                                                    scannerRef.current = qr;
                                                    qr.start({ facingMode: "environment" }, { fps: 10, qrbox: 200 }, (txt) => { setFormData({...formData, code: txt}); qr.stop(); setIsScanning(false); });
                                                }, 300)}, className: "bg-slate-100 text-slate-600 px-4 rounded-xl hover:bg-slate-200" }, h(Icon, { name: "scan" }))
                                            )
                                        ),
                                        h('div', null,
                                            h('label', { className: "text-xs font-bold text-slate-500 uppercase mb-1.5 block" }, "ชื่อรายการ"),
                                            h('input', { required: true, className: "w-full p-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500", value: formData.name, onChange: e => setFormData({...formData, name: e.target.value}) })
                                        ),
                                        h('div', { className: "grid grid-cols-2 gap-4" },
                                            h('div', null,
                                                h('label', { className: "text-xs font-bold text-slate-500 uppercase mb-1.5 block" }, "ราคา"),
                                                h('input', { type: "number", className: "w-full p-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500", value: formData.price, onChange: e => setFormData({...formData, price: e.target.value}) })
                                            ),
                                            h('div', null,
                                                h('label', { className: "text-xs font-bold text-slate-500 uppercase mb-1.5 block" }, "สถานที่เก็บ"),
                                                h('input', { className: "w-full p-3 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500", value: formData.location, onChange: e => setFormData({...formData, location: e.target.value}) })
                                            )
                                        )
                                    )
                                )
                            ),
                            // Footer
                            h('div', { className: "p-6 border-t border-slate-100 bg-white" },
                                h('button', { 
                                    onClick: handleSubmit, 
                                    disabled: loading, 
                                    className: `w-full py-4 rounded-xl font-bold shadow-lg transition-all flex items-center justify-center gap-2 ${loading ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-900 text-white hover:bg-slate-800'}` 
                                }, loading ? h(Icon, { name: "loader", className: "animate-spin" }) : h(Icon, { name: "save", className: "w-5 h-5" }), loading ? "กำลังบันทึก..." : "บันทึกข้อมูล")
                            )
                        )
                    )
                ),

                // --- SETTINGS SIDEBAR (Left) ---
                h('div', { className: `fixed inset-0 z-50 overflow-hidden ${isSettingsOpen ? 'pointer-events-auto' : 'pointer-events-none'}` },
                    h('div', { className: `absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-300 ${isSettingsOpen ? 'opacity-100' : 'opacity-0'}`, onClick: () => setIsSettingsOpen(false) }),
                    h('div', { className: `absolute inset-y-0 left-0 max-w-full flex transition-transform duration-300 ${isSettingsOpen ? 'translate-x-0' : '-translate-x-full'}` },
                        h('div', { className: "w-screen max-w-sm bg-white shadow-2xl flex flex-col h-full" },
                            h('div', { className: "px-6 py-6 border-b border-slate-100" },
                                h('h2', { className: "text-xl font-black text-slate-800 flex items-center gap-2" }, h(Icon, { name: "settings", className: "w-6 h-6 text-indigo-600" }), "ตั้งค่าระบบ")
                            ),
                            h('div', { className: "flex-1 overflow-y-auto p-6 custom-scroll" },
                                h('div', { className: "space-y-6" },
                                    h('div', null,
                                        h('label', { className: "text-xs font-bold text-slate-400 uppercase mb-2 block" }, "Google Web App URL"),
                                        h('input', { 
                                            className: "w-full p-4 border border-slate-200 rounded-xl text-xs bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500", 
                                            value: scriptUrl, 
                                            onChange: e => setScriptUrl(e.target.value), 
                                            placeholder: "https://script.google.com/..." 
                                        }),
                                        h('button', { 
                                            onClick: () => { localStorage.setItem('mt_script_url', scriptUrl); setIsSettingsOpen(false); fetchData(); }, 
                                            className: "w-full mt-3 bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm shadow-indigo-100 shadow-lg" 
                                        }, "บันทึกและเชื่อมต่อ")
                                    ),
                                    h('div', { className: "bg-slate-50 p-4 rounded-2xl border border-slate-100" },
                                        h('h4', { className: "font-bold text-sm text-slate-700 mb-2 flex items-center gap-2" }, h(Icon, { name: "code", className: "w-4 h-4" }), "สำหรับผู้ดูแลระบบ"),
                                        h('p', { className: "text-xs text-slate-500 mb-4 leading-relaxed" }, "คัดลอกโค้ดด้านล่างไปวางใน Apps Script เพื่ออัปเดตระบบหลังบ้านให้รองรับการบันทึกรูปภาพ"),
                                        h('button', { 
                                            onClick: copyToClipboard, 
                                            className: `w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition-all border ${copied ? 'bg-green-50 text-green-600 border-green-200' : 'bg-white text-slate-600 border-slate-200'}` 
                                        }, h(Icon, { name: copied ? "check" : "copy", className: "w-3.5 h-3.5" }), copied ? "คัดลอกเรียบร้อย" : "คัดลอก Code")
                                    )
                                )
                            )
                        )
                    )
                ),

                // --- OVERLAYS ---
                isScanning && h('div', { className: "fixed inset-0 z-[60] bg-black flex flex-col items-center justify-center p-6" },
                    h('div', { className: "w-full max-w-sm rounded-2xl overflow-hidden bg-white relative" }, h('div', { id: "reader" })),
                    h('button', { onClick: () => { if(scannerRef.current) scannerRef.current.stop(); setIsScanning(false); }, className: "mt-8 bg-white/20 text-white px-8 py-3 rounded-full font-bold backdrop-blur-md" }, "ยกเลิก")
                ),
                isCapturing && h('div', { className: "fixed inset-0 z-[60] bg-black flex flex-col items-center justify-center p-4" },
                    h('div', { className: "w-full max-w-sm rounded-2xl overflow-hidden bg-slate-900 shadow-2xl border border-slate-800" },
                        h('video', { ref: videoRef, autoPlay: true, playsInline: true, className: "w-full aspect-square object-cover" })
                    ),
                    h('div', { className: "flex gap-4 mt-8" },
                        h('button', { onClick: stopCamera, className: "bg-white/10 text-white px-6 py-3 rounded-full font-bold" }, "ยกเลิก"),
                        h('button', { onClick: takePhoto, className: "bg-indigo-600 text-white px-10 py-3 rounded-full font-bold shadow-xl flex items-center gap-2" }, h(Icon, { name: "camera", className: "w-5 h-5" }), "ถ่ายเลย")
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(App));
    </script>
</body>
</html>
